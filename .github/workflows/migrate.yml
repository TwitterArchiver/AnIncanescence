name: 迁移：重建状态并刷新索引

# 用于老脚本手动跑出来的仓库：html/ 与 json/ 都在，但缺 _log/ 与 archive_index.json。
# rebuild-index 从现有文件反推状态，build-index 用当前脚本重新生成 index.json
# （顺带拿到 raw_text 换行修复、embedded 引用框、GIF 等新逻辑）。
# 不重新抓取任何东西。跑完确认无误后即可删除本文件。

on:
  workflow_dispatch:
    inputs:
      accounts:
        description: '账号目录名，逗号分隔；留空则自动扫描 accounts/'
        required: false
        default: ''

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 安装依赖
        run: pip install requests beautifulsoup4 lxml --quiet

      - name: 拉取最新脚本
        run: |
          curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/archive.py" -o /tmp/archive.py
          echo "archive.py $(wc -l < /tmp/archive.py) 行"

      - name: 读取账号列表
        id: info
        run: |
          IN="${{ github.event.inputs.accounts }}"
          if [ -n "$IN" ]; then
            ACCOUNTS=$(echo "$IN" | tr ',' '\n' | sed 's/ //g' | grep -v '^$')
          else
            # 扫 accounts/ 下所有含 wayback_snapshots 的目录（不依赖仓库名）
            ACCOUNTS=$(ls -1 accounts 2>/dev/null | while IFS= read -r name; do
              [ -d "accounts/${name}/wayback_snapshots" ] && echo "$name"
            done)
          fi
          if [ -z "$ACCOUNTS" ]; then
            echo "::error::没找到任何账号目录"
            exit 1
          fi
          echo "将处理："
          echo "$ACCOUNTS" | sed 's/^/  - /'
          echo "accounts<<EOF" >> $GITHUB_OUTPUT
          echo "$ACCOUNTS"     >> $GITHUB_OUTPUT
          echo "EOF"           >> $GITHUB_OUTPUT

      - name: rebuild-index（从现有文件重建状态）
        run: |
          while IFS= read -r U; do
            [ -z "$U" ] && continue
            [ -d "accounts/${U}/wayback_snapshots" ] || continue
            echo "::group::[$U] rebuild-index"
            ( cd "accounts/${U}" && python3 /tmp/archive.py rebuild-index ) || echo "::warning::[$U] rebuild-index 有非零退出，继续"
            echo "::endgroup::"
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: fetch-media（补齐从未下载成功过的媒体）
        run: |
          while IFS= read -r U; do
            [ -z "$U" ] && continue
            [ -d "accounts/${U}/wayback_snapshots" ] || continue
            echo "::group::[$U] fetch-media"
            ( cd "accounts/${U}" && python3 /tmp/archive.py fetch-media ) || echo "::warning::[$U] fetch-media 有失败项（通常是 Wayback 404），继续"
            echo "::endgroup::"
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: build-index（用新脚本重新生成 index.json）
        run: |
          while IFS= read -r U; do
            [ -z "$U" ] && continue
            [ -d "accounts/${U}/wayback_snapshots" ] || continue
            echo "::group::[$U] build-index"
            ( cd "accounts/${U}" && python3 /tmp/archive.py build-index ) || echo "::warning::[$U] build-index 有非零退出，继续"
            echo "::endgroup::"
          done <<< "${{ steps.info.outputs.accounts }}"

      - name: 同步 index.html 的账号列表
        run: |
          if [ ! -f index.html ]; then
            curl -fsSL "https://raw.githubusercontent.com/sjshb57/Test/main/index.html" -o index.html
          fi
          ACCOUNTS="${{ steps.info.outputs.accounts }}"
          ACCOUNTS_JSON=$(echo "$ACCOUNTS" | awk '{printf "'\''%s'\'', ", $0}' | sed "s/, $//")
          sed -i "s/const ACCOUNTS_HARDCODED = \[.*\]/const ACCOUNTS_HARDCODED = [${ACCOUNTS_JSON}]/" index.html || true
          echo "ACCOUNTS_HARDCODED = [${ACCOUNTS_JSON}]"

      - name: 推送
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "无变化"
            exit 0
          fi
          COUNT=$(git diff --cached --name-only | grep -v -e "/_log/" -e "/archive_index\.json$" -e "/index\.json$" -e "/media_index\.json$" | wc -l)
          [ "$COUNT" -eq 0 ] && COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "🔧 迁移：重建状态并刷新索引 (+${COUNT} 文件) $(date -u +%Y-%m-%d) [skip ci]"
          git push
